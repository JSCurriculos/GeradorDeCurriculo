<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes"/>
<title>Juliana Santiago | Reformulação de Currículos</title>
<link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-size='70' fill='%23d4af37' font-family='monospace'>JS</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Cormorant+Garamond:wght@500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
/* ========== ESTILOS (MANTIDOS) ========== */
:root{
  --bg:#eef3f9;
  --white:#fff;
  --text:#1e293b;
  --royal:#082642;
  --gold:#d4af37;
  --goldSoft:#f3df96;
  --line:#dde6f1;
  --shadow:0 10px 30px rgba(15,23,42,.08);
  --radius:24px;
  --t1-bg-start:#082642;
  --t1-bg-end:#031320;
  --t1-text:#ffffff;
  --t1-accent:#d4af37;
  --t3-bg-start:#082642;
  --t3-bg-end:#03111f;
  --t3-text:#ffffff;
  --t3-accent:#f3df96;
  --t3-border:rgba(255,255,255,.15);
}
*{ margin:0; padding:0; box-sizing:border-box; }
body{ font-family:Inter,sans-serif; background:var(--bg); color:var(--text); overflow-x:hidden; }

/* SPLASH */
.splash{
  position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 30% 20%, #0a1a2a, #020b14);
  backdrop-filter:blur(2px);
  transition:opacity .8s ease, visibility .8s ease;
  opacity:1; visibility:visible; cursor:pointer;
}
.splash.hide{ opacity:0; visibility:hidden; }
#particles-canvas{
  position:absolute; top:0; left:0; width:100%; height:100%;
  pointer-events:none; z-index:1;
}
.splash-content{
  position:relative; z-index:2; text-align:center; color:white;
  padding:0 20px;
}
.splash-logo{
  width:170px; height:170px; margin:0 auto 30px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle,rgba(255,255,255,.12),transparent 70%);
  border:1px solid rgba(212,175,55,.5);
  box-shadow:0 0 30px rgba(212,175,55,.3);
  animation:auraPulse 3s infinite;
}
@keyframes auraPulse{
  0%,100%{ box-shadow:0 0 30px rgba(212,175,55,.25); border-color:rgba(212,175,55,.4); }
  50%{ box-shadow:0 0 55px rgba(212,175,55,.5); border-color:rgba(212,175,55,.8); }
}
.splash-logo span{ font-size:4.5rem; color:var(--goldSoft); font-family:"Cormorant Garamond",serif; font-weight:700; letter-spacing:-2px; text-shadow:0 0 8px rgba(212,175,55,.6); }
.splash h1{ font-size:2.5rem; letter-spacing:4px; font-weight:600; font-family:"Cormorant Garamond",serif; background:linear-gradient(135deg,#fff,#e2c47c); -webkit-background-clip:text; background-clip:text; color:transparent; margin-bottom:12px; }
.splash p{ color:#cdba7a; letter-spacing:4px; font-size:.85rem; text-transform:uppercase; }
.swipe{ margin-top:40px; animation:floatSmooth 2s infinite; display:flex; flex-direction:column; align-items:center; gap:8px; color:#cdba7a; }
@keyframes floatSmooth{ 0%,100%{ transform:translateY(0); opacity:.7; } 50%{ transform:translateY(-10px); opacity:1; } }
.enter-btn { background: var(--gold); color: #0f172a; border: none; border-radius: 40px; padding: 10px 24px; font-weight: bold; margin-top: 20px; cursor: pointer; font-size: 1rem; }

/* DASHBOARD */
.dashboard{
  max-width:1500px; margin:auto; padding:20px; display:grid; grid-template-columns:360px 1fr; gap:24px;
  opacity:0; transform:translateY(10px); transition:opacity .5s, transform .5s;
}
.dashboard.show{ opacity:1; transform:translateY(0); }
.form-card{ background:white; border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; position:sticky; top:20px; height:calc(100vh - 40px); display:flex; flex-direction:column; }
.form-header{ background:linear-gradient(135deg,var(--royal),#03111f); color:white; padding:24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; }
.form-header h2{ display:flex; align-items:center; gap:10px; }
.btn-manage-sections{ background:var(--gold); color:#0f172a; border:none; border-radius:30px; padding:6px 12px; font-size:0.7rem; cursor:pointer; }
.form-scroll{ padding:22px; overflow-y:auto; flex:1; }
.input-group{ margin-bottom:18px; }
.input-group label{ display:block; margin-bottom:7px; font-size:.72rem; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--royal); }
.textarea-toolbar { display: flex; gap: 5px; margin-bottom: 5px; }
.textarea-toolbar button { background: #edf2f7; border: none; border-radius: 8px; padding: 4px 8px; font-size: 12px; cursor: pointer; }
.textarea-toolbar button:hover { background: #d4af37; }
input, textarea{ width:100%; border:1px solid var(--line); border-radius:14px; padding:12px 14px; font:inherit; outline:none; background:#fbfdff; transition:.2s; }
textarea{ resize:vertical; min-height:95px; }
.btn-group{ display:flex; flex-wrap:wrap; gap:8px; margin-top:20px; }
button{ border:none; border-radius:999px; padding:10px 14px; cursor:pointer; font-weight:700; transition:.2s; font-size:0.8rem; }
button:hover{ transform:translateY(-2px); }
.btn-gold{ background:var(--gold); color:#1e293b; }
.btn-dark{ background:var(--royal); color:white; }
.btn-light{ background:#edf2f7; color:#1e293b; }

.preview-area{ background:white; border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); display:flex; flex-direction:column; }
.preview-header{ padding:20px 24px; border-bottom:1px solid #e8eef5; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
.preview-header h2{ color:var(--royal); display: flex; align-items: center; gap: 8px; }
.edit-mode-btn, .spacing-btn, .style-btn, .mobile-view-btn { background: none; border: none; font-size: 1.1rem; cursor: pointer; color: var(--royal); padding: 4px 8px; border-radius: 30px; transition:0.2s; }
.edit-mode-btn { color: var(--gold); }
.edit-mode-btn.active { background: var(--gold); color: #0f172a; }
.spacing-btn:hover, .style-btn:hover, .mobile-view-btn:hover { background: #f3f7fc; }
.template-selector{ display:flex; gap:8px; flex-wrap:wrap; }
.temp-btn{ background:#f3f7fc; border:1px solid #d9e4ef; padding:6px 12px; border-radius:30px; font-size:.75rem; cursor:pointer; }
.temp-btn.active{ background:var(--royal); color:white; }
.color-picker{ display:none; gap:8px; align-items:center; margin-top:8px; }
.color-picker.show{ display:flex; }
.color-swatch{ width:28px; height:28px; border-radius:50%; cursor:pointer; border:2px solid #d9e4ef; }
.resume-wrap{ padding:18px; background:#eef3f9; overflow-x: auto; transition: max-width 0.3s; }
.resume-wrap.mobile-preview{ max-width: 375px; margin: 0 auto; }
.resume{ background:white; border-radius:18px; overflow:hidden; box-shadow:0 8px 25px rgba(0,0,0,.06); min-height:1000px; }

/* TEMPLATES */
.template-1 .resume-top{ background:linear-gradient(135deg,var(--t1-bg-start),var(--t1-bg-end)); color:var(--t1-text); padding:42px; }
.resume-name{ font-size:2.5rem; font-weight:800; line-height:1.1; margin-bottom: 10px; }
.resume-role{ margin-top:0; opacity:.95; }
.contact{ margin-top:18px; display:flex; flex-wrap:wrap; gap:16px; font-size:.92rem; }
.resume-body{ padding:40px; }
.section, .section-box{ margin-bottom:28px; }
.section h3 span, .section-box h3{ border-left:4px solid var(--gold); padding-left:12px; }
.section h3, .section-box h3 { margin-bottom: 20px; }
.section p, .section-box p, .side-info p { margin-bottom: 12px; line-height: 1.5; }
.section ul, .section-box ul { list-style: disc; margin-left: 20px; margin-bottom: 12px; }
.section li, .section-box li { margin-bottom: 5px; }

.template-2 .resume-top{ background:white; border-bottom:2px solid var(--gold); padding:42px; color:var(--text); }
.template-2 .resume-name{ color:var(--royal); margin-bottom:10px; }
.template-2 .section{ border:1px solid #e7edf5; border-radius:16px; padding:20px; margin-bottom:20px; }

.template-3 .offshore-layout{ display:grid; grid-template-columns:300px 1fr; min-height:1000px; }
.template-3 .offshore-sidebar{ background:linear-gradient(180deg,var(--t3-bg-start),var(--t3-bg-end)); color:var(--t3-text); padding:40px 28px; height:100%; }
.template-3 .offshore-photo{ width:170px; height:170px; border-radius:50%; object-fit:cover; display:block; margin:0 auto 24px; border:5px solid var(--t3-border); cursor:pointer; transition:0.2s; }
.template-3 .offshore-photo:hover { opacity:0.8; }
.template-3 .offshore-name{ font-size:1.8rem; font-weight:800; text-align:center; margin-bottom:10px; }
.template-3 .offshore-role{ text-align:center; color:var(--t3-accent); margin-bottom:20px; }
.template-3 .side-title{ margin-top:28px; margin-bottom:10px; color:var(--t3-accent); font-size:.74rem; }
.template-3 .side-info{ line-height:1.8; font-size:.92rem; }
.template-3 .offshore-main{ padding:40px; }

/* MODAIS */
.sections-modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:20000; align-items:center; justify-content:center; }
.sections-modal.show { display: flex; }
.sections-modal-content { background:white; width:90%; max-width:550px; max-height:80vh; border-radius:32px; overflow:auto; padding:20px; }
.section-list { list-style:none; margin-bottom:20px; }
.section-list li { display:flex; align-items:center; justify-content:space-between; background:#f8fafc; margin:8px 0; padding:10px 12px; border-radius:20px; cursor:grab; user-select:none; border:1px solid transparent; }
.section-list li.dragging { opacity:0.5; cursor:grabbing; background:#e2e8f0; }
.section-list li.drag-over { border:2px dashed var(--gold); }
.section-list li .section-title { flex:1; font-weight:500; word-break:break-word; }
.section-list li .section-title input { width:auto; background:transparent; border:1px solid #ccc; border-radius:12px; padding:4px 8px; font-size:0.9rem; }
.section-list li .controls { display:flex; gap:8px; }
.section-list li .controls button { background:none; border:none; cursor:pointer; font-size:1rem; padding:4px 6px; border-radius:12px; }
.section-list li .controls button:hover { background:#e2e8f0; }
.add-section { display:flex; gap:8px; margin-top:15px; }
.add-section input { flex:1; padding:10px; border-radius:40px; border:1px solid #ddd; }
.add-section button { background:var(--gold); color:#0f172a; border:none; padding:8px 16px; border-radius:40px; cursor:pointer; }
.modal-actions { display:flex; gap:10px; margin-top:20px; justify-content:space-between; }
.close-modal-btn, .reset-order-btn { background:#edf2f7; padding:8px; border-radius:40px; flex:1; border:none; cursor:pointer; }
.reset-order-btn { background:var(--royal); color:white; }

.modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:10000; align-items:center; justify-content:center; }
.modal.show { display: flex; }
.modal-content { background:white; width:90%; max-width:800px; max-height:85vh; border-radius:32px; overflow:hidden; display:flex; flex-direction:column; }
.modal-header { background:linear-gradient(135deg,var(--royal),#03111f); color:white; padding:18px 24px; display:flex; justify-content:space-between; align-items:center; }
.modal-tabs { display:flex; border-bottom:1px solid #ddd; background:#f8fafc; }
.tab-btn { flex:1; padding:12px; background:none; border:none; font-weight:600; cursor:pointer; }
.tab-btn.active { background:white; color:var(--royal); border-bottom:3px solid var(--gold); }
.modal-body { flex:1; overflow-y:auto; padding:20px; }
.lista-item { background:#f8fafc; border-radius:16px; padding:14px 18px; margin-bottom:12px; border-left:4px solid var(--gold); }
.btn-carregar { background:var(--gold); color:#1e293b; border:none; padding:6px 14px; border-radius:30px; margin-top:8px; font-size:0.75rem; cursor:pointer; }

/* ========== CSS PARA IMPRESSÃO (PDF PERFEITO) ========== */
@media print {
  @page {
    margin: 0;
    size: A4;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: white;
  }
  body * {
    visibility: hidden;
  }
  #resume, #resume * {
    visibility: visible;
  }
  #resume {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    margin: 0;
    padding: 0;
    background: white;
    box-shadow: none;
    border-radius: 0;
    z-index: 99999;
  }
  .resume-top, .offshore-sidebar, .section, .section-box, .template-2 .section, .template-1 .resume-top, .template-3 .offshore-sidebar {
    print-color-adjust: exact !important;
    -webkit-print-color-adjust: exact !important;
  }
  .section, .section-box {
    break-inside: avoid;
    page-break-inside: avoid;
  }
  .template-2 .contact {
    white-space: normal;
    flex-wrap: wrap;
  }
  .template-3 .offshore-layout {
    display: grid !important;
    grid-template-columns: 280px 1fr !important;
    min-height: 100vh !important;
  }
}
@media (max-width: 1100px) {
  .dashboard { grid-template-columns: 1fr; }
  .form-card { position: relative; height: auto; margin-bottom: 20px; }
  .preview-header { flex-direction: column; align-items: stretch; }
  .template-3 .offshore-layout { grid-template-columns: 1fr; }
  .template-3 .offshore-sidebar { padding: 25px; }
  .btn-group button { font-size: 0.7rem; padding: 6px 10px; }
}
</style>
</head>
<body>

<div class="splash" id="splash" tabindex="0" role="button">
  <canvas id="particles-canvas"></canvas>
  <div class="splash-content">
    <div class="splash-logo"><span>JS</span></div>
    <h1>JULIANA SANTIAGO</h1>
    <p>Reformulação de Currículos</p>
    <div class="swipe"><i class="fas fa-hand-pointer"></i> Toque, clique ou pressione Enter</div>
    <button class="enter-btn" id="enterBtn">Acessar gerador →</button>
  </div>
</div>

<div class="dashboard" id="dashboard">
  <div class="form-card">
    <div class="form-header">
      <h2><i class="fas fa-id-card"></i> Dados do currículo</h2>
      <button id="manageSectionsBtn" class="btn-manage-sections"><i class="fas fa-layer-group"></i> Gerenciar seções</button>
    </div>
    <div class="form-scroll">
      <div class="input-group"><label>Nome completo</label><input id="nome" placeholder="Ex: Juliana Santiago"></div>
      <div class="input-group"><label>Cargo / Área</label><input id="cargo" placeholder="Ex: Designer Gráfico"></div>
      <div class="input-group"><label>Telefone</label><input id="telefone" placeholder="(11) 99999-9999"></div>
      <div class="input-group"><label>E-mail</label><input id="email" placeholder="contato@exemplo.com"></div>
      <div class="input-group"><label>Cidade / Estado</label><input id="cidade" placeholder="São Paulo - SP"></div>
      
      <div class="input-group"><label>Objetivo profissional</label><textarea id="objetivo" placeholder="Descreva seu objetivo profissional..."></textarea></div>
      
      <div class="input-group"><label>Experiências</label>
        <div class="textarea-toolbar">
          <button type="button" data-target="experiencias" class="format-btn" data-format="bold"><b>N</b></button>
          <button type="button" data-target="experiencias" class="format-btn" data-format="italic"><i>I</i></button>
          <button type="button" data-target="experiencias" class="format-btn" data-format="list"><i class="fas fa-list-ul"></i></button>
        </div>
        <textarea id="experiencias" placeholder="Digite sua experiência profissional. Use **negrito**, *itálico*. Para criar lista, use o botão de lista ou digite '-' no início da linha."></textarea>
      </div>
      <div class="input-group"><label>Formação</label>
        <div class="textarea-toolbar">
          <button type="button" data-target="formacao" class="format-btn" data-format="bold"><b>N</b></button>
          <button type="button" data-target="formacao" class="format-btn" data-format="italic"><i>I</i></button>
          <button type="button" data-target="formacao" class="format-btn" data-format="list"><i class="fas fa-list-ul"></i></button>
        </div>
        <textarea id="formacao" placeholder="Digite sua formação acadêmica..."></textarea>
      </div>
      <div class="input-group"><label>Cursos</label>
        <div class="textarea-toolbar">
          <button type="button" data-target="cursos" class="format-btn" data-format="bold"><b>N</b></button>
          <button type="button" data-target="cursos" class="format-btn" data-format="italic"><i>I</i></button>
          <button type="button" data-target="cursos" class="format-btn" data-format="list"><i class="fas fa-list-ul"></i></button>
        </div>
        <textarea id="cursos" placeholder="Digite seus cursos e certificações..."></textarea>
      </div>
      <div class="input-group"><label>Habilidades</label>
        <div class="textarea-toolbar">
          <button type="button" data-target="habilidades" class="format-btn" data-format="bold"><b>N</b></button>
          <button type="button" data-target="habilidades" class="format-btn" data-format="italic"><i>I</i></button>
          <button type="button" data-target="habilidades" class="format-btn" data-format="list"><i class="fas fa-list-ul"></i></button>
        </div>
        <textarea id="habilidades" placeholder="Digite suas habilidades..."></textarea>
      </div>
      
      <div class="input-group" id="fotoGroup"><label>Foto do candidato</label><input type="file" id="foto" accept="image/*"></div>
      <div class="input-group"><label>Título Experiência</label><input id="tituloExperiencia" value="EXPERIÊNCIA PROFISSIONAL"></div>
      <div class="input-group"><label>Título Formação</label><input id="tituloFormacao" value="FORMAÇÃO"></div>
      <div class="input-group"><label>Título Cursos</label><input id="tituloCursos" value="CURSOS E CERTIFICAÇÕES"></div>
      <div class="input-group"><label>Título Habilidades</label><input id="tituloHabilidades" value="HABILIDADES"></div>
      <div id="customSectionsContainer"></div>
      <div class="btn-group">
        <button class="btn-gold" id="btnGerarPDF"><i class="fas fa-file-pdf"></i> Gerar PDF</button>
        <button class="btn-light" id="btnPreviewPDF"><i class="fas fa-eye"></i> Pré‑visualizar PDF</button>
        <button class="btn-dark" id="btnSalvarNuvem"><i class="fas fa-cloud-upload-alt"></i> Salvar na nuvem</button>
        <button class="btn-light" id="btnSalvarLocal"><i class="fas fa-save"></i> Salvar local</button>
        <button class="btn-light" id="btnLimparCampos"><i class="fas fa-eraser"></i> Limpar dados</button>
        <button class="btn-light" data-toggle-section="exp">Ocultar Experiência</button>
        <button class="btn-light" data-toggle-section="form">Ocultar Formação</button>
        <button class="btn-light" data-toggle-section="cursos">Ocultar Cursos</button>
        <button class="btn-light" data-toggle-section="hab">Ocultar Habilidades</button>
        <button class="btn-light" id="desfazerBtn">↺ Desfazer</button>
      </div>
    </div>
  </div>

  <div class="preview-area">
    <div class="preview-header">
      <h2><i class="fas fa-eye"></i> Pré-visualização 
        <button id="editModeBtn" class="edit-mode-btn" title="Editar diretamente no currículo"><i class="fas fa-pencil-alt"></i></button>
        <button id="spacingBtn" class="spacing-btn" title="Ajustar espaçamento"><i class="fas fa-arrows-alt"></i></button>
        <button id="styleBtn" class="style-btn" title="Alterar fonte e tamanho"><i class="fas fa-font"></i></button>
        <button id="mobileViewBtn" class="mobile-view-btn" title="Visualização móvel"><i class="fas fa-mobile-alt"></i></button>
      </h2>
      <div>
        <div class="template-selector">
          <button class="temp-btn active" data-temp="1">Modelo 1</button>
          <button class="temp-btn" data-temp="2">Modelo 2</button>
          <button class="temp-btn" data-temp="3">Modelo 3</button>
        </div>
        <div class="color-picker" id="colorPicker">
          <span class="label">Cor:</span>
          <div class="color-swatch active" data-color="royal" style="background:linear-gradient(135deg,#082642,#0b3c75);"></div>
          <div class="color-swatch" data-color="darkgray" style="background:linear-gradient(135deg,#2d2d2d,#1a1a1a);"></div>
          <div class="color-swatch" data-color="lightgray" style="background:linear-gradient(135deg,#a8a8a8,#7a7a7a);"></div>
          <div class="color-swatch" data-color="white" style="background:linear-gradient(135deg,#ffffff,#e8e8e8);"></div>
        </div>
      </div>
      <button class="btn-light" id="btnVerCadastros"><i class="fas fa-database"></i> Ver dados salvos</button>
    </div>
    <div class="resume-wrap" id="resumeWrap">
      <div id="resume" class="resume template-1"></div>
    </div>
  </div>
</div>

<!-- Modais (mesmos do original) -->
<div id="spacingModal" style="display:none; position:fixed; bottom:20px; right:20px; background:white; border-radius:16px; padding:16px; z-index:10001; width:260px;">

(function initStars(){
  const canvas = document.getElementById('particles-canvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  let w, h, stars = [], animationId = null, active = true;
  function resize(){ w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);
  for(let i=0;i<140;i++) stars.push({ x: Math.random()*w, y: Math.random()*h, r: Math.random()*1.8+0.4, a: Math.random(), s: Math.random()*0.02+0.005, vx: (Math.random()-0.5)*0.12, vy: (Math.random()-0.5)*0.12 });
  function draw(){
    if(!active) return;
    ctx.clearRect(0,0,w,h);
    for(let st of stars){
      st.a += st.s; if(st.a>1||st.a<0) st.s = -st.s;
      st.x += st.vx; st.y += st.vy;
      if(st.x<0) st.x=w; if(st.x>w) st.x=0; if(st.y<0) st.y=h; if(st.y>h) st.y=0;
      const alpha = Math.abs(Math.sin(st.a * Math.PI));
      ctx.beginPath(); ctx.arc(st.x,st.y,st.r,0,Math.PI*2);
      ctx.fillStyle = `rgba(243,223,150,${alpha})`;
      ctx.shadowColor = 'rgba(243,223,150,0.8)'; ctx.shadowBlur = 6;
      ctx.fill();
    }
    animationId = requestAnimationFrame(draw);
  }
  draw();
  window.stopParticles = function() { 
    active = false; 
    if(animationId) cancelAnimationFrame(animationId); 
  };
})();

// ========== FORMATAÇÃO DE TEXTO ==========
function formatContent(text) {
  if (!text || text.trim() === '') return '<p>— Nenhuma informação adicionada —</p>';
  let sanitized = DOMPurify.sanitize(text, { ALLOWED_TAGS: ['ul','li','strong','em','p','br','b','i','u'], ALLOWED_ATTR: [] });
  if (/<ul|<li/.test(sanitized)) return sanitized;
  sanitized = sanitized.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  sanitized = sanitized.replace(/\*(.*?)\*/g, '<em>$1</em>');
  const lines = sanitized.split('\n');
  let inList = false;
  let result = [];
  for (let i = 0; i < lines.length; i++) {
    let line = lines[i];
    if (line.trim().match(/^[-•]\s+/)) {
      if (!inList) { result.push('<ul>'); inList = true; }
      let content = line.replace(/^[-•]\s+/, '');
      result.push(`<li>${content}</li>`);
    } else {
      if (inList) { result.push('</ul>'); inList = false; }
      if (line.trim() === '') { result.push('<p><br></p>'); }
      else { result.push(`<p>${line}</p>`); }
    }
  }
  if (inList) result.push('</ul>');
  let finalHtml = result.join('');
  if (finalHtml === '') finalHtml = '<p>— Nenhuma informação adicionada —</p>';
  return finalHtml;
}

function insertMarkdown(textarea, before, after, defaultText = 'texto') {
  const start = textarea.selectionStart;
  const end = textarea.selectionEnd;
  const selectedText = textarea.value.substring(start, end) || defaultText;
  const newText = textarea.value.substring(0, start) + before + selectedText + after + textarea.value.substring(end);
  textarea.value = newText;
  textarea.focus();
  textarea.selectionStart = start + before.length;
  textarea.selectionEnd = start + before.length + selectedText.length;
  textarea.dispatchEvent(new Event('input'));
}

    else if (format === 'italic') insertMarkdown(textarea, '*', '*', 'texto em itálico');
    else if (format === 'list') insertMarkdown(textarea, '- ', '', 'item da lista');
  });
});

btnVer.addEventListener('click', () => { modal.classList.add('show'); carregarLeads(); carregarCurriculoLocal(); carregarCurriculosCloud(); });
fecharModal.addEventListener('click', () => modal.classList.remove('show'));
async function carregarLeads() { const sup=initSupabase(); const {data}=await sup.from('cadastros').select('*').order('created_at',{ascending:false}); document.getElementById('tabLeads').innerHTML=data?.map(item=>`<div class="lista-item"><strong>${escapeHtml(item.nome)}</strong><br>📞 ${escapeHtml(item.telefone)}<br>✉️ ${escapeHtml(item.email)}</div>`).join('')||'<p>Nenhum lead.</p>'; }
function carregarCurriculoLocal() { const saved=localStorage.getItem('curriculoPremium'); if(saved){ const data=JSON.parse(saved); document.getElementById('tabCurriculosLocal').innerHTML=`<div class="lista-item"><strong>${escapeHtml(data.nome||'Sem nome')}</strong><br><button class="btn-carregar" onclick="carregarCurriculoDoLocalStorage()">Carregar</button></div>`; } else document.getElementById('tabCurriculosLocal').innerHTML='<p>Nenhum currículo local.</p>'; }
window.carregarCurriculoDoLocalStorage = function() { const raw=localStorage.getItem('curriculoPremium'); if(raw){ const data=JSON.parse(raw); Object.keys(inputs).forEach(k=>{ if(data[k]!==undefined) inputs[k].value=data[k]; }); if(data.__color) aplicarCor(data.__color); if(data.template) trocarTemplate(data.template); if(data.foto_base64) fotoBase64=data.foto_base64; renderResume(); modal.classList.remove('show'); alert('Carregado!'); } };
async function carregarCurriculosCloud() { const sup=initSupabase(); const {data}=await sup.from('curriculos').select('id,nome,cargo,updated_at').order('updated_at',{ascending:false}); document.getElementById('tabCurriculosCloud').innerHTML=data?.map(item=>`<div class="lista-item"><strong>${escapeHtml(item.nome||'Sem nome')}</strong> – ${escapeHtml(item.cargo||'')}<br><button class="btn-carregar" data-id="${item.id}">Carregar</button></div>`).join('')||'<p>Nenhum currículo.</p>'; document.querySelectorAll('#tabCurriculosCloud .btn-carregar').forEach(btn=>btn.addEventListener('click',async()=>{ const id=btn.dataset.id; const sup=initSupabase(); const {data}=await sup.from('curriculos').select('*').eq('id',id).single(); if(data){ Object.keys(inputs).forEach(k=>{ if(document.getElementById(k) && data[k.toLowerCase()]!==undefined) document.getElementById(k).value=data[k.toLowerCase()]; }); if(data.cor) aplicarCor(data.cor); if(data.template) trocarTemplate(data.template); if(data.foto_base64) fotoBase64=data.foto_base64; renderResume(); alert('Carregado!'); } })); }

// ========== BOTÕES LÁPIS, ESPAÇAMENTO, ESTILOS ==========
const editBtn = document.getElementById('editModeBtn');
editBtn.addEventListener('click', () => { editMode = !editMode; if(editMode){ enableInlineEditing(); editBtn.classList.add('active'); } else { disableInlineEditing(); editBtn.classList.remove('active'); } });
const spacingBtn = document.getElementById('spacingBtn'), spacingModalElem = document.getElementById('spacingModal'), closeSpacing = document.getElementById('closeSpacing');
spacingBtn.onclick=()=>spacingModalElem.style.display='block'; closeSpacing.onclick=()=>spacingModalElem.style.display='none';
document.getElementById('marginSlider').oninput=()=>{ localStorage.setItem('currMargin',document.getElementById('marginSlider').value); applyCustomSpacing(); };
document.getElementById('sectionSlider').oninput=()=>{ localStorage.setItem('currSectionMargin',document.getElementById('sectionSlider').value); applyCustomSpacing(); };
document.getElementById('resetSpacing').onclick=()=>{ localStorage.removeItem('currMargin'); localStorage.removeItem('currSectionMargin'); applyCustomSpacing(); };
const styleBtn = document.getElementById('styleBtn'), styleModalElem = document.getElementById('styleModal'), closeStyle = document.getElementById('closeStyle');
styleBtn.onclick=()=>styleModalElem.style.display='block'; closeStyle.onclick=()=>styleModalElem.style.display='none';
document.getElementById('fontFamilySelect').onchange=e=>{ localStorage.setItem('currFontFamily',e.target.value); applyFontStyles(); };
document.getElementById('fontSizeSlider').oninput=e=>{ localStorage.setItem('currFontSize',e.target.value); document.getElementById('fontSizeValue').innerText=e.target.value; applyFontStyles(); };
document.querySelectorAll('.font-size-btn').forEach(btn=>btn.addEventListener('click',()=>{ const size=btn.dataset.size; localStorage.setItem('currFontSize',size); document.getElementById('fontSizeSlider').value=size; document.getElementById('fontSizeValue').innerText=size; applyFontStyles(); }));
document.getElementById('resetStyles').addEventListener('click',resetStyles);
document.getElementById('mobileViewBtn').addEventListener('click',()=>document.getElementById('resumeWrap').classList.toggle('mobile-preview'));
// SEÇÕES
const manageBtn = document.getElementById('manageSectionsBtn'), sectionsModalElem = document.getElementById('sectionsModal'), closeSectionsModal = document.getElementById('closeSectionsModal');
const addSectionBtn = document.getElementById('addSectionBtn'), newSectionTitleInput = document.getElementById('newSectionTitle');
manageBtn.onclick=()=>{ renderSectionsModal(); sectionsModalElem.classList.add('show'); };
closeSectionsModal.onclick=()=>sectionsModalElem.classList.remove('show');
addSectionBtn.onclick=()=>{ const title=newSectionTitleInput.value.trim(); if(title) addCustomSection(title); newSectionTitleInput.value=''; };
document.getElementById('resetOrderBtn').addEventListener('click', () => { if(confirm('Restaurar ordem padrão?')) { sectionsOrder = predefinedSections.map(s=>({id:s.id,type:'predefined',title:s.title})); saveSectionsOrder(); renderSectionsModal(); renderResume(); } });
// EVENTOS INICIAIS
document.querySelectorAll('.color-swatch').forEach(s=>s.addEventListener('click',()=>aplicarCor(s.dataset.color)));
document.getElementById('foto').addEventListener('change',e=>{ const f=e.target.files[0]; if(f){ const reader=new FileReader(); reader.onload=ev=>{ fotoBase64=ev.target.result; renderResume(); }; reader.readAsDataURL(f); } });
Object.values(inputs).forEach(i=>i.addEventListener('input',renderResume));
document.querySelectorAll('.temp-btn').forEach(b=>b.addEventListener('click',()=>trocarTemplate(Number(b.dataset.temp))));
document.querySelectorAll('[data-toggle-section]').forEach(btn=>btn.addEventListener('click',()=>toggleSection(btn.dataset.toggleSection)));
carregarDadosLocal(); trocarTemplate(1); renderResume(); loadSectionsOrder(); renderCustomFieldsInForm();
setupEnterNormal();
</script>
</body>
</html>
